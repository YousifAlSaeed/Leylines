# Publishes client/ as the site root on GitHub Pages.
# Takes effect once Settings → Pages → Source is set to "GitHub Actions".
# (With "Deploy from a branch", the root index.html forwards to client/ instead.)
name: Deploy client to Pages

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client
      - id: deployment
        uses: actions/deploy-pages@v4
